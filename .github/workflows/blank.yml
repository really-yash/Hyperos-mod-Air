name: Recon HyperOS air - Theme AOD ControlCenter

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

# This spell cancels hanging runs so your new job starts INSTANTLY ⚡
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils
          # Your tool links are perfect and up-to-date! ✨
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: Download and extract fastboot ROM
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted

      - name: Unpack super.img
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          mkdir -p super_unpacked
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          lpunpack "$SUPER_RAW" super_unpacked

      - name: Extract EROFS partitions
        run: |
          mkdir -p tree/system tree/system_ext tree/product tree/vendor tree/mi_ext
          for part in system system_ext product vendor mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: Locate Theme Manager
        run: |
          echo "===== ThemeManager folder ====="
          find tree -iname "*ThemeManager*" || true
          find tree -iname "privapp_whitelist_com.android.thememanager*" || true

      - name: Locate AOD
        run: |
          echo "===== AOD folder ====="
          find tree -iname "*Aod*" -o -iname "*aod*" || true
          find tree -iname "privapp_whitelist_com.miui.aod*" || true

      - name: Locate SystemUI / Control Center plugin host
        run: |
          echo "===== SystemUI folder (plugin host app) ====="
          # Fixed the -maxdepth syntax error! 🛠️
          find tree -maxdepth 6 -iname "*SystemUI*" || true
          find tree -iname "*SystemUIPlugin*" || true
          echo "===== Any existing plugin overlay dirs ====="
          find tree -path "*overlay*Plugin*" || true
