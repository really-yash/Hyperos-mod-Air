name: 🌸 Decompile SystemUI - find low RAM check UwU 🌸

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

# This spell cancels hanging runs so your new job starts INSTANTLY ⚡
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decompile:
    name: (✿◠‿◠) Smali Decompile Job
    runs-on: ubuntu-24.04
    steps:
      - name: 🧹 (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ Sweeping disk space OwO
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: 🛠️ ʕ•ᴥ•ʔ Getting our shiny tools ready UwU
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils default-jdk
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/
          
          # Upgraded to the fast GitHub Releases link! 🚀
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool

      - name: 📥 (๑>ᴗ<๑) Snatching the fastboot ROM!
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted

      - name: ✨ (ᵘﻌᵘ) Unpacking super.img magic~
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          mkdir -p super_unpacked tree/system_ext
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          lpunpack "$SUPER_RAW" super_unpacked
          
          # Safe extraction logic
          SYS_EXT_IMG=$(find super_unpacked -iname "system_ext_a.img" -o -iname "system_ext.img" | head -1)
          sudo fsck.erofs --extract=tree/system_ext "$SYS_EXT_IMG"

      - name: 🔓 (✧ω✧) Decompile MiuiSystemUI.apk (NO RES)
        run: |
          APK=$(find tree/system_ext -iname "MiuiSystemUI.apk" | head -1)
          echo "Decompiling: $APK"
          # Added -r to skip resources! Prevents the crash and makes it 10x faster! 🌸
          java -jar apktool.jar d "$APK" -o decompiled_systemui -f -r

      - name: 🔍 (O_O) Search for low_ram / blur decision logic in smali
        run: |
          echo "===== Searching for threshold_gb references ====="
          grep -rln "low_ram" decompiled_systemui --include="*.smali" | head -20 || true

          echo "===== Searching for isLowRamDevice calls ====="
          grep -rln "isLowRamDevice" decompiled_systemui --include="*.smali" | head -20 || true

          echo "===== Searching for blur-related class names ====="
          find decompiled_systemui -iname "*Blur*.smali" || true

          echo "===== Searching for ControlCenter/QS panel class names ====="
          find decompiled_systemui -iname "*ControlCenter*.smali" || true
          find decompiled_systemui -iname "*QSPanel*.smali" | head -10 || true

      - name: 📦 (◠‿◠✿) Upload decompiled smali for review
        uses: actions/upload-artifact@v4
        with:
          name: systemui-smali-search-results
          # Added warn flag just in case nothing is found so it doesn't crash
          if-no-files-found: warn
          path: |
            decompiled_systemui/smali*/**/*Blur*
            decompiled_systemui/smali*/**/*ControlCenter*
          retention-days: 3
