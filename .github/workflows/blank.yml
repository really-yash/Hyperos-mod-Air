name: 🌸 Recon HyperOS App Extractor UwU 🌸

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

# This spell cancels hanging runs so your new job starts INSTANTLY ⚡
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uwu_recon:
    name: (✿◠‿◠) App Extraction Job
    runs-on: ubuntu-24.04
    steps:
      - name: 🧹 (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ Sweeping disk space OwO
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 🛠️ ʕ•ᴥ•ʔ Getting our shiny tools ready UwU
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils
          
          # Using the permanent commit mirror for lpunpack! (ó﹏ò｡)
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: 📥 (๑>ᴗ<๑) Snatching the fastboot ROM! 
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted

      - name: ✨ (ᵘﻌᵘ) Converting and Unpacking super.img magic~
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          mkdir -p super_unpacked
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          # Run the binary directly
          lpunpack "$SUPER_RAW" super_unpacked

      - name: 📂 ٩(◕‿◕｡)۶ Extracting EROFS partitions cutely
        run: |
          mkdir -p tree/system tree/system_ext tree/product tree/vendor tree/mi_ext
          for part in system system_ext product vendor mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: 📱 (⌐■_■) Listing ALL Extracted Applications
        run: |
          echo "===== 🌟 Comprehensive App Inventory 🌟 ====="
          
          # Loop through each extracted partition
          for part in system system_ext product vendor mi_ext; do
            echo ""
            echo "========================================="
            echo " 🔍 Scanning partition: $part"
            echo "========================================="
            
            # Find all APK files safely (using || true to avoid Exit Code 1)
            # We use awk to parse the folder structure and beautifully print the App Type and Name
            find "tree/$part" -type f -name "*.apk" 2>/dev/null | awk -F'/' -v part="$part" '{
              for(i=1;i<=NF;i++) {
                # Look for the folders named "app" or "priv-app" in the file path
                if ($i == "app" || $i == "priv-app") {
                  type = $i
                  appName = $(i+1)
                  print "[" part "] " type " -> " appName
                  break
                }
              }
            }' | sort -u || true
            
          done
          
          echo ""
          echo "🌸 All apps successfully identified! 🌸"
