name: 🛠️ Phase 1 - ROM Forensics & Blueprinting

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"
  KASHI_LAUNCHER_URL: "https://github.com/Mods-Center/HyperOS-Launcher/releases/download/V6.2/HyperOS_LauncherV6.2%40kashis_cringey_stuffs.zip"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensics:
    name: BSP Forensic Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: 🧹 Clean Environment & Install Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar unzip android-sdk-libsparse-utils attr file
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: 📥 Fetch & Extract Stock ROM
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted super_unpacked
          tar -xf rom.tgz -C rom_extracted
          
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          
          # Unpack logical partitions
          lpunpack "$SUPER_RAW" super_unpacked

      - name: 📊 Blueprint 1: Logical Partition Sizing & EROFS Superblock
        run: |
          mkdir -p forensics_output
          echo "=== Logical Partition Raw Sizes ===" > forensics_output/partition_sizes.txt
          ls -la super_unpacked/*_a.img >> forensics_output/partition_sizes.txt
          
          echo "=== EROFS Compression Format ===" > forensics_output/erofs_format.txt
          dump.erofs super_unpacked/system_a.img | grep -i "compression" >> forensics_output/erofs_format.txt || true
          dump.erofs super_unpacked/product_a.img | grep -i "compression" >> forensics_output/erofs_format.txt || true

      - name: 📂 Extract Targets (As Root for UID accuracy)
        run: |
          mkdir -p tree/system tree/product tree/mi_ext
          sudo fsck.erofs --extract=tree/system $(find super_unpacked -iname "system_a.img" | head -1)
          sudo fsck.erofs --extract=tree/product $(find super_unpacked -iname "product_a.img" | head -1)

      - name: 🔐 Blueprint 2: SELinux Contexts & Permissions
        run: |
          echo "=== SELinux Context Map ===" > forensics_output/selinux_contexts.txt
          
          echo "--- Locating Context Manifests ---" >> forensics_output/selinux_contexts.txt
          find rom_extracted super_unpacked -iname "*file_contexts*" >> forensics_output/selinux_contexts.txt || true
          find tree/system -iname "*file_contexts*" >> forensics_output/selinux_contexts.txt || true
          
          echo "--- Stock App Original Contexts ---" >> forensics_output/selinux_contexts.txt
          TARGETS=(
            "tree/product/priv-app/MiuiHome/MiuiHome.apk"
            "tree/product/priv-app/MIUISecurityCenterGlobal/MIUISecurityCenterGlobal.apk"
          )
          for t in "${TARGETS[@]}"; do
            if [ -f "$t" ]; then
              echo "File: $t" >> forensics_output/selinux_contexts.txt
              ls -la "$t" >> forensics_output/selinux_contexts.txt
              sudo getfattr -d -m - "$t" 2>&1 >> forensics_output/selinux_contexts.txt
            fi
          done

      - name: 📄 Blueprint 3: XML Encoding (Text vs Binary)
        run: |
          echo "=== XML Format Check ===" > forensics_output/xml_encoding.txt
          find tree -iname "air.xml" -type f | while read xml; do
            echo "Checking: $xml" >> forensics_output/xml_encoding.txt
            file "$xml" >> forensics_output/xml_encoding.txt
          done

      - name: 🧠 Blueprint 4: Services.jar Architecture
        run: |
          echo "=== services.jar Structure ===" > forensics_output/services_structure.txt
          mkdir -p /tmp/services_unpack
          sudo cp tree/system/system/framework/services.jar /tmp/services_unpack/
          cd /tmp/services_unpack
          unzip -l services.jar | grep ".dex" >> $GITHUB_WORKSPACE/forensics_output/services_structure.txt || true

      - name: 🏗️ Blueprint 5: Kashi Mod Analysis
        run: |
          mkdir -p /tmp/kashi_mod
          wget -q -O launcher.zip "$KASHI_LAUNCHER_URL"
          unzip -q launcher.zip -d /tmp/kashi_mod
          echo "=== Kashi customize.sh ===" > forensics_output/kashi_script.txt
          cat /tmp/kashi_mod/customize.sh >> forensics_output/kashi_script.txt || true

      - name: 📦 Upload Forensics Data
        uses: actions/upload-artifact@v4
        with:
          name: Air-ROM-Blueprints
          path: forensics_output/*
          retention-days: 1
