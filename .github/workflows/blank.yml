name: 🌸 Recon HyperOS air UwU 🌸

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uwu_recon:
    name: (✿◠‿◠) HyperOS Recon Job
    runs-on: ubuntu-22.04
    steps:
      - name: 🧹 (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ Sweeping disk space OwO
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 🛠️ ʕ•ᴥ•ʔ Getting our shiny tools ready UwU
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils
          # Downloading a pre-built lpunpack binary instead of pip (ó﹏ò｡)
          wget -q https://raw.githubusercontent.com/erfanoabdi/Firmware_extractor/master/tools/lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/
          lpunpack --help || echo "lpunpack check done 🌸"

      - name: 📥 (๑>ᴗ<๑) Snatching the fastboot ROM! 
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted
          find rom_extracted -iname "*.img" | sort

      - name: ✨ (ᵘﻌᵘ) Converting and Unpacking super.img magic~
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          echo "Found super.img at: $SUPER"
          file "$SUPER"
          mkdir -p super_unpacked

          if file "$SUPER" | grep -qi "sparse"; then
            echo "Sparse image detected, converting... (✧ω✧)"
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi

          # Using the new binary! 
          lpunpack "$SUPER_RAW" super_unpacked

          echo "----- Unpacked logical partitions (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ -----"
          find super_unpacked -type f

      - name: 📂 ٩(◕‿◕｡)۶ Extracting EROFS partitions cutely
        run: |
          mkdir -p tree/system tree/system_ext tree/product tree/vendor
          for part in system system_ext product vendor; do
            IMG=$(find super_unpacked -iname "${part}.img" -o -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              echo "Extracting $part from $IMG 🌸"
              fsck.erofs --extract="tree/$part" "$IMG"
            else
              echo "No $part image found in super_unpacked (｡•́︿•̀｡)"
            fi
          done

      - name: 🔍 (⌐■_■) Finding target app folders UwU
        run: |
          echo "===== Searching for MiuiHome (launcher) 🌸 ====="
          find tree -iname "*MiuiHome*"
          echo "===== Searching for SecurityCenter 🛡️ ====="
          find tree -iname "*SecurityCenter*"
          echo "===== Searching for PersonalAssistant / AppVault 📱 ====="
          find tree -iname "*PersonalAssistant*"
          find tree -iname "*AppVault*"
          echo "===== Searching for XiaomiEUExt 🌍 ====="
          find tree -iname "*XiaomiEUExt*"

      - name: 📜 (O_O) Checking privapp_whitelist files...
        run: |
          find tree -iname "privapp_whitelist_com.miui.home*"
          find tree -iname "privapp_whitelist_com.miui.securitycenter*"
          find tree -iname "privapp_whitelist_com.miui.personalassistant*"

      - name: 🗑️ (◠‿◠✿) Dumping priv-app folder listings
        run: |
          for part in system system_ext product; do
            echo "===== tree/$part priv-app ====="
            find "tree/$part" -maxdepth 3 -type d -iname "priv-app" -exec ls -la {} \;
          done

      - name: 📏 (^-^*) Show sizes before we go bye-bye!
        run: |
          du -sh tree/* 2>/dev/null
          df -h
