name: Recon HyperOS air

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: Download and extract fastboot ROM
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted

      - name: Unpack super.img
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          mkdir -p super_unpacked
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          # Run the binary directly instead of calling python3 -m
          lpunpack "$SUPER_RAW" super_unpacked

      - name: Extract EROFS partitions
        run: |
          mkdir -p tree/system tree/system_ext tree/product tree/vendor tree/mi_ext
          for part in system system_ext product vendor mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: Search for App Vault package (broad)
        run: |
          echo "===== grep AndroidManifest for personalassistant / appvault package strings ====="
          grep -rl "personalassistant" tree --include="AndroidManifest.xml" 2>/dev/null
          grep -rl "appvault" tree -il 2>/dev/null | head -30
          echo "===== Any folder with 'assistant' or 'vault' in the name ====="
          find tree -iname "*assistant*"
          find tree -iname "*vault*"
          echo "===== Any folder with 'Global' suffix in mi_ext/product priv-app (Xiaomi naming pattern) ====="
          find tree/mi_ext -maxdepth 3 -type d -iname "priv-app" -exec ls -la {} \; 2>/dev/null

      - name: Full priv-app + app listing for manual review
        run: |
          for part in system system_ext product vendor mi_ext; do
            echo "===== $part/app + priv-app full listing ====="
            find "tree/$part" -maxdepth 3 -type d \( -iname "app" -o -iname "priv-app" \) -exec find {} -maxdepth 1 -mindepth 1 -type d \;
          done
