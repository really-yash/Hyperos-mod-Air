name: 🕵️ Greeshan HyperOS 2 Deep Audit

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Target ROM URL'
        required: true
        # Cleaned SourceForge URL (No IP locks or session tokens!)
        default: 'https://downloads.sourceforge.net/project/miui-greeshan-repack/HyperOS2/Redmi-13C-air/greeshan.by_Redmi13C_5G_air_OS2.0.208.0.VGQINXM_15.0_99c03.zip'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensics_lab:
    name: "Deep Architecture Audit"
    runs-on: ubuntu-24.04
    steps:
      - name: "🧹 Clean Environment & Install Tools"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget unzip android-sdk-libsparse-utils file
          
          # Dropped lpdump. We will rely on lpunpack and manual math!
          BASE_URL="https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary"
          wget -q $BASE_URL/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: "📥 Download & Unpack Target ROM"
        run: |
          mkdir -p rom_extracted forensics_output
          # Added --trust-server-names and --max-redirect to safely handle SourceForge CDN routing
          wget -q --show-progress --trust-server-names --max-redirect=10 -O target_rom.zip "${{ github.event.inputs.rom_url }}"
          unzip -q target_rom.zip -d rom_extracted || true

      - name: "📜 Audit 1 - Flash Scripts & Fastboot Logic"
        run: |
          echo "=== Batch & Shell Scripts ===" > forensics_output/1_flash_scripts.txt
          find rom_extracted -iname "*.bat" -o -iname "*.sh" -o -iname "*.cmd" | while read script; do
            echo "--- File: $(basename "$script") ---" >> forensics_output/1_flash_scripts.txt
            cat "$script" >> forensics_output/1_flash_scripts.txt
            echo -e "\n\n" >> forensics_output/1_flash_scripts.txt
          done

      - name: "🔥 Audit 2 - Super Structure & Logical Boundaries"
        run: |
          echo "=== Super Metadata & Partition Sizes ===" > forensics_output/2_super_structure.txt
          SUPER=$(find rom_extracted -iname "super*.img" | head -1)
          
          if [ -n "$SUPER" ]; then
            if file "$SUPER" | grep -qi "sparse"; then
              simg2img "$SUPER" super_raw.img
              SUPER_TARGET="super_raw.img"
            else
              SUPER_TARGET="$SUPER"
            fi
            
            # Since we dropped lpdump, we directly unpack and measure the logical partitions
            mkdir -p super_unpacked
            lpunpack "$SUPER_TARGET" super_unpacked || true
            
            echo -e "\n=== Extracted Logical Image Sizes (Bytes) ===" >> forensics_output/2_super_structure.txt
            ls -lh super_unpacked/*.img >> forensics_output/2_super_structure.txt || true
            
            echo -e "\n=== Total Logical Blueprint Size ===" >> forensics_output/2_super_structure.txt
            du -ch super_unpacked/*.img | grep total >> forensics_output/2_super_structure.txt || true
          else
            echo "No super.img found directly. Checking top-level images..." >> forensics_output/2_super_structure.txt
            ls -lh rom_extracted/*.img >> forensics_output/2_super_structure.txt || true
          fi

      - name: "📂 Extract EROFS Partitions (Product & System)"
        run: |
          mkdir -p tree/product tree/system
          PRODUCT_IMG=$(find super_unpacked rom_extracted -iname "product*.img" | head -1)
          SYSTEM_IMG=$(find super_unpacked rom_extracted -iname "system*.img" | head -1)
          
          if [ -n "$PRODUCT_IMG" ]; then
            sudo fsck.erofs --extract=tree/product "$PRODUCT_IMG" || true
          fi
          if [ -n "$SYSTEM_IMG" ]; then
            sudo fsck.erofs --extract=tree/system "$SYSTEM_IMG" || true
          fi

      - name: "✨ Audit 3 - HyperOS 2 Features & Device Spoofing"
        run: |
          echo "=== Device Features (air.xml) ===" > forensics_output/3_feature_flags.txt
          AIR_XML=$(find tree/product -iname "air.xml" | head -1)
          if [ -n "$AIR_XML" ]; then
            grep -E "support_window_blur|support_new_control_center|is_low_end_device" "$AIR_XML" >> forensics_output/3_feature_flags.txt || true
          else
            echo "air.xml not found." >> forensics_output/3_feature_flags.txt
          fi
          
          echo -e "\n=== Low RAM & Spoofing (build.prop) ===" >> forensics_output/3_feature_flags.txt
          find tree -iname "build.prop" -exec grep -H -E "low_ram|ro.product.model|ro.product.device|ro.product.name" {} \; >> forensics_output/3_feature_flags.txt || true

      - name: "🧹 Audit 4 - Debloat Verification"
        run: |
          echo "=== Bloatware Presence Check ===" > forensics_output/4_debloat_status.txt
          BLOAT_LIST=(
            "tree/product/app/MSA-Global"
            "tree/product/app/AnalyticsCore"
            "tree/product/app/facebook-appmanager"
            "tree/product/priv-app/facebook-installer"
            "tree/product/priv-app/facebook-services"
            "tree/product/app/cit"
            "tree/product/app/YTMusic"
          )
          
          for bloat in "${BLOAT_LIST[@]}"; do
            if [ -d "$bloat" ]; then
              echo "[FAIL] Bloatware Found: $(basename "$bloat")" >> forensics_output/4_debloat_status.txt
            else
              echo "[PASS] Cleaned: $(basename "$bloat")" >> forensics_output/4_debloat_status.txt
            fi
          done

      - name: "📦 Upload Audit Reports"
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Deep-Audit-Reports
          path: forensics_output/*
          retention-days: 3
