name: 🌸 Recon HyperOS air - SELinux and ownership check UwU 🌸

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

# This spell cancels hanging runs so your new job starts INSTANTLY ⚡
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uwu_recon:
    name: (✿◠‿◠) SELinux & Ownership Job
    runs-on: ubuntu-24.04
    steps:
      - name: 🧹 (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ Sweeping disk space OwO
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: 🛠️ ʕ•ᴥ•ʔ Getting our shiny tools ready UwU
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar android-sdk-libsparse-utils attr
          wget -q https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: 📥 (๑>ᴗ<๑) Snatching the fastboot ROM!
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted

      - name: ✨ (ᵘﻌᵘ) Unpacking super.img magic~
        run: |
          SUPER=$(find rom_extracted -iname "super.img" | head -1)
          mkdir -p super_unpacked
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_RAW="super_raw.img"
          else
            SUPER_RAW="$SUPER"
          fi
          lpunpack "$SUPER_RAW" super_unpacked

      - name: 📂 ٩(◕‿◕｡)۶ Extracting EROFS partitions AS ROOT
        run: |
          mkdir -p tree/product
          # Separated the find command to prevent syntax errors if product_a.img is missing
          PRODUCT_IMG=$(find super_unpacked -iname "product_a.img" | head -1)
          if [ -n "$PRODUCT_IMG" ]; then
            sudo fsck.erofs --extract=tree/product "$PRODUCT_IMG"
          else
            echo "product_a.img not found! (｡•́︿•̀｡)"
          fi

      - name: 🕵️ (⌐■_■) Check who we are
        run: id

      - name: 🔍 (O_O) Check original file attributes (before any replacement)
        run: |
          TARGET="tree/product/priv-app/MiuiHome/MiuiHome.apk"
          echo "===== ls -la ====="
          ls -la "$TARGET" || true
          echo "===== getfattr (selinux context) ====="
          sudo getfattr -d -m - "$TARGET" 2>&1 || true

      - name: 🔄 (◠‿◠✿) Simulate a plain cp and re-check attributes
        run: |
          TARGET="tree/product/priv-app/MiuiHome/MiuiHome.apk"
          
          # Using sudo cp because fsck.erofs extracted files as root!
          sudo cp "$TARGET" /tmp/backup_original.apk || true
          sudo cp /tmp/backup_original.apk "$TARGET" || true
          
          echo "===== AFTER plain cp overwrite ====="
          ls -la "$TARGET" || true
          sudo getfattr -d -m - "$TARGET" 2>&1 || true

      - name: 📜 (^-^*) Check if file_contexts / fs_config manifest exists
        run: |
          echo "===== Checking rom_extracted ====="
          find rom_extracted -iname "*file_contexts*" || true
          find rom_extracted -iname "*fs_config*" || true
          echo "===== Checking super_unpacked ====="
          find super_unpacked -iname "*file_contexts*" || true
