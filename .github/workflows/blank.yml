name: Recon HyperOS air

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar

      - name: Download and extract fastboot ROM
        run: |
          wget -q -O rom.tgz "$ROM_URL"
          mkdir -p rom_extracted
          tar -xf rom.tgz -C rom_extracted
          echo "----- All .img files -----"
          find rom_extracted -iname "*.img" | sort

      - name: Extract EROFS partitions
        run: |
          mkdir -p tree/system tree/system_ext tree/product tree/vendor
          for part in system system_ext product vendor; do
            IMG=$(find rom_extracted -iname "${part}.img" | head -1)
            if [ -n "$IMG" ]; then
              echo "Extracting $part from $IMG"
              fsck.erofs --extract="tree/$part" "$IMG"
            else
              echo "No $part.img found"
            fi
          done
          find rom_extracted -iname "vbmeta*.img"

      - name: Locate target app folders
        run: |
          echo "===== Searching for MiuiHome (launcher) ====="
          find tree -iname "*MiuiHome*" -maxdepth 6

          echo "===== Searching for SecurityCenter ====="
          find tree -iname "*SecurityCenter*" -maxdepth 6

          echo "===== Searching for PersonalAssistant / AppVault ====="
          find tree -iname "*PersonalAssistant*" -maxdepth 6
          find tree -iname "*AppVault*" -maxdepth 6

          echo "===== Searching for XiaomiEUExt ====="
          find tree -iname "*XiaomiEUExt*" -maxdepth 6

      - name: Check privapp_whitelist files (confirms package identity)
        run: |
          echo "===== privapp_whitelist for com.miui.home ====="
          find tree -iname "privapp_whitelist_com.miui.home*"
          echo "===== privapp_whitelist for com.miui.securitycenter ====="
          find tree -iname "privapp_whitelist_com.miui.securitycenter*"
          echo "===== privapp_whitelist for com.miui.personalassistant ====="
          find tree -iname "privapp_whitelist_com.miui.personalassistant*"

      - name: Dump directory tree of priv-app folders (top-level only)
        run: |
          for part in system system_ext product; do
            echo "===== tree/$part/*/priv-app ====="
            find "tree/$part" -maxdepth 3 -type d -iname "priv-app" -exec ls -la {} \;
          done

      - name: Show sizes for sanity check
        run: |
          du -sh tree/system tree/system_ext tree/product 2>/dev/null
          df -h
